pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.2
    # base_link is about 0.31 m above the ground in the recorded indoor runs.
    # Keep low obstacles while excluding the measured floor band near -0.30 m.
    min_height: -0.2
    max_height: 1.0
    angle_min: -3.1415927
    angle_max: 3.1415927
    angle_increment: 0.0174533
    scan_time: 0.0666667
    range_min: 0.2
    range_max: 5.0
    use_inf: true
    inf_epsilon: 1.0
